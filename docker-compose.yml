services:
  api:
    build: ./backend
    environment:
      - PORT=3000
      - CORS_ORIGIN=http://localhost:8080
      - APP_VERSION=1.2.0
    ports: ["3000:3000"]
  web:
    build:
      context: ./frontend
      args: [VITE_API_URL=http://localhost:3000]
    ports: ["8080:80"]
    depends_on: [api]
